---
- name: Configure Python FastAPI application server
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/app
    app_user: appuser
    app_group: appgroup
    venv_dir: /opt/app/.venv
    gunicorn_bin: /opt/app/.venv/bin/gunicorn
    python_bin: /opt/app/.venv/bin/python
    service_name: python-app

  tasks:
    #  Wait for cloud-init to finish so apt locks are released 
    - name: Wait for cloud-init to complete
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    #  System packages 
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - nginx
          - git
          - curl
          - build-essential
        state: present

    #  Dedicated application user / group 
    - name: Create app group
      ansible.builtin.group:
        name: "{{ app_group }}"
        gid: 1500
        state: present

    - name: Create app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        uid: 1500
        system: true
        shell: /bin/bash
        home: "{{ app_dir }}"
        create_home: false
        state: present

    #  Application directory 
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    #  Sync application code 
    - name: Copy application package (app/)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: "{{ app_dir }}/app/"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Copy main.py entrypoint
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../main.py"
        dest: "{{ app_dir }}/main.py"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"

    - name: Check if requirements.txt exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../requirements.txt"
      register: req_file
      delegate_to: localhost
      become: false

    - name: Copy requirements.txt if it exists
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../requirements.txt"
        dest: "{{ app_dir }}/requirements.txt"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      when: req_file.stat.exists

    - name: Check if public/ directory exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../public"
      register: public_dir
      delegate_to: localhost
      become: false

    - name: Copy public/ static assets if they exist
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../public/"
        dest: "{{ app_dir }}/public/"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
        directory_mode: "0755"
      when: public_dir.stat.exists and public_dir.stat.isdir

    #  Python virtual environment 
    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv "{{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/activate"

    - name: Set venv ownership
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: true
        state: directory

    - name: Upgrade pip in venv
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/pip install --upgrade pip"
      changed_when: true

    - name: Install Python dependencies from requirements.txt
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/requirements.txt"
      when: req_file.stat.exists
      changed_when: true

    - name: Install fallback dependencies if no requirements.txt
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/pip install fastapi uvicorn[standard] gunicorn"
      when: not req_file.stat.exists
      changed_when: true

    #  Validate installed packages 
    - name: Validate Python packages (pip check)
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python -m pip check"
      changed_when: false
      register: pip_check_result
      failed_when: pip_check_result.rc != 0

    #  Environment file 
    - name: Create app environment file
      ansible.builtin.shell: |
        cat > {{ app_dir }}/.env << 'ENVEOF'
        APP_ENV=production
        PORT=8000
        HOST=0.0.0.0
        ENVEOF
        chown {{ app_user }}:{{ app_group }} {{ app_dir }}/.env
        chmod 640 {{ app_dir }}/.env
      args:
        executable: /bin/bash
      changed_when: true

    #  Systemd service 
    - name: Create systemd service file
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Python FastAPI Application
          After=network.target
          Wants=network.target

          [Service]
          Type=exec
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile={{ app_dir }}/.env
          ExecStart={{ gunicorn_bin }} app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
          Restart=on-failure
          RestartSec=5s
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier={{ service_name }}

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start application service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: restarted

    #  Nginx reverse proxy 
    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Create nginx site config
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/app
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;

              location / {
                  proxy_pass         http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_set_header   Upgrade           $http_upgrade;
                  proxy_set_header   Connection        "upgrade";
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 75s;
              }
          }

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and restart nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: restarted

    #  Verify service health on host 
    - name: Wait for application to become healthy
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        method: GET
        status_code: [200, 307]
        follow_redirects: all
      register: health_check
      retries: 12
      delay: 10
      until: health_check.status in [200, 307]